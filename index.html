<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#222">
    <title>Juego de la Oca</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <main class="app-shell">
        <header class="page-header">
            <p class="eyebrow">Un juego para compartir</p>
            <h1>Juego de la Oca</h1>
            <p class="subtitle">Tira el dado, avanza por el tablero y pon a prueba tus conocimientos.</p>
        </header>

        <form id="formularioJugadores" class="players-form">
            <fieldset>
                <legend>Preparad la partida</legend>
                <label for="nombreJugadorA">Jugador rojo</label>
                <input id="nombreJugadorA" name="nombreJugadorA" type="text" placeholder="Jugador A">
                <label for="nombreJugadorB">Jugador azul</label>
                <input id="nombreJugadorB" name="nombreJugadorB" type="text" placeholder="Jugador B">
                <button class="button button-secondary" type="submit">Nueva partida</button>
            </fieldset>
        </form>

        <div class="game-layout">
            <section class="board-card">
                <div id="tablero">
                    <div id="fichaA" class="ficha roja"></div>
                    <div id="fichaB" class="ficha azul"></div>
                </div>
                <div class="board-legend">
                    <span><i class="legend-dot roja"></i>Rojo</span>
                    <span><i class="legend-dot azul"></i>Azul</span>
                </div>
            </section>

            <section class="game-panel">
                <div class="turn-heading">
                    <p class="eyebrow">Partida en curso</p>
                    <h2 id="infoTorn">Turno de Jugador A</h2>
                </div>
                <div class="dice-actions">
                    <button id="botoDauA" class="button button-red" type="button">Tirar dado - Jugador rojo</button>
                    <button id="botoDauB" class="button button-blue" type="button">Tirar dado - Jugador azul</button>
                </div>
                <p id="resultadoDado" class="dice-result" aria-live="polite" aria-atomic="true">Pulsa «Tirar dado» para empezar.</p>
                <div id="infoJugadores" class="player-status"></div>
            </section>
        </div>
    </main>

    <dialog id="panelPregunta" class="question-dialog">
        <div class="question-content">
            <p class="eyebrow">¡Casilla de pregunta!</p>
            <h2 id="enunciatPregunta"></h2>
            <div id="opcionsContenidor" class="answer-options">
                <button type="button"></button>
                <button type="button"></button>
                <button type="button"></button>
                <button type="button"></button>
            </div>
            <p id="resultadoPregunta" class="question-result"></p>
            <button id="continuarPregunta" class="button button-primary oculto" type="button">Continuar la partida</button>
        </div>
    </dialog>

    <script src="index.js"></script>
</body>
</html>
