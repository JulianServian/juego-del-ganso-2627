<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Exercici 2: Funcions i Retorn</title>
</head>
<body>
  <div id="salida"></div>

  <h2>Operacions del joc</h2>
  <button onclick="executarSuma()">Sumar Punts (5 + 3)</button>
  <button onclick="executarMultiplicacio()">Multiplicar Bonificació (4 x 2)</button>
  <div id="resultatOperacions"></div> <!-- Canviat per a la suma/multiplicació -->
  
  <h2>Taula de multiplicar</h2>
  <label for="numInput">Introdueix un número:</label>
  <input type="number" id="numInput" placeholder="Ex: 5" required>
  <button onclick="processarNumero()">Calcular</button>

  <p id="missatgeValidacio"></p>
  <div id="resultatTaula"></div>

  <p id="miTexto">Text original</p>
  <button id="miBoton">Clicame</button>

  <h2 id="infoTurno">Torn del Jugador A</h2>
  <p id="resultatDau">Fes clic per llançar el dau.</p> 
  <button id="botonDado">Llançar dau</button>

  <h2>Formulari</h2>
  <form id="formulariJugador">
    <label for="nom">Nom del jugador:</label>
    <input type="text" id="nom" required>
    <button type="submit">Enviar</button>
  </form>

  <p id="missatge"></p>
  
  
  <button id="botoTirar">Tirar el dau</button>
  <p id="resultatTirada"></p>
  <p id="resultatCasella"></p>

  <h2 id="enunciatPregunta"></h2>
  <div id="opcionsContenidor"></div>
  <p id="resultatPregunta"></p>

  <script src="index.js"></script>
</body>
</html>
